<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · {{ app_name }}</title><link rel="stylesheet" href="/static/app.css"></head><body class="login-shell"><main class="login-card"><div class="brand-mark">⌁</div><p class="eyebrow">HOMELAB CONTROL</p><h1>Acesso seguro</h1><p class="muted">Entre para monitorar sua infraestrutura.</p>{% if error %}<div class="alert danger">{{ error }}</div>{% endif %}<form method="post" action="/login"><label>Usuário<input name="username" autocomplete="username" required autofocus></label><label>Senha<input type="password" name="password" autocomplete="current-password" required></label><button class="button primary" type="submit">Entrar</button></form></main></body></html>
